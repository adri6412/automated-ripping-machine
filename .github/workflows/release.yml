name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name AutoRipMachine run.pyw

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "release") { "${{ github.event.release.tag_name }}" } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force dist/AutoRipMachine/tools | Out-Null
          Copy-Item README.md, LICENSE dist/AutoRipMachine/
          Set-Content dist/AutoRipMachine/tools/LEGGIMI.txt "Copia qui cyanrip.exe, ffmpeg.exe e mkvmerge.exe per un pacchetto autonomo (oppure indica i percorsi nelle Impostazioni)."
          $zip = "AutoRipMachine-$version-win64.zip"
          Compress-Archive -Path dist/AutoRipMachine -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRipMachine-win64
          path: ${{ steps.package.outputs.zip }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.zip }}" --clobber --repo "${{ github.repository }}"
