name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq "release") { "${{ github.event.release.tag_name }}" -replace '^v', '' } else { "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name AutoRipMachine run.pyw

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/AutoRipMachine/tools | Out-Null
          Copy-Item README.md, LICENSE dist/AutoRipMachine/
          Set-Content dist/AutoRipMachine/tools/LEGGIMI.txt "Copia qui cyanrip.exe per un pacchetto autonomo; MakeMKV va installato a parte (oppure usa l'installer, che scarica entrambi)."
          $zip = "dist/AutoRipMachine-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path dist/AutoRipMachine -DestinationPath $zip
          Remove-Item dist/AutoRipMachine/tools -Recurse -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\AutoRipMachine.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "setup=dist/AutoRipMachine-Setup-${{ steps.version.outputs.version }}.exe" >> $env:GITHUB_OUTPUT

      # Exercises the real download URLs on Windows, then checks the app finds every tool.
      - name: Test dependency downloader
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer\install-deps.ps1 `
            -InstallDir $env:GITHUB_WORKSPACE -Cyanrip -MakeMKV -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from arm.core.config import find_tool; paths = {n: find_tool(n) for n in ('cyanrip', 'makemkvcon')}; print(paths); assert all(paths.values())"

      # Informational: makemkvcon starts and reports no drives on the runner.
      - name: Smoke test makemkvcon
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -c "from arm.core import makemkv; k = makemkv.get_registered_key(); print('chiave:', (k or 'nessuna')[:6])"
          python -c "from arm.core import makemkv; from arm.core.config import find_tool; print(makemkv.list_drives(find_tool('makemkvcon')))"

      # Best effort: an exhausted artifact storage quota must not block the release upload.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: AutoRipMachine-win64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.setup }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.installer.outputs.setup }}" "${{ steps.package.outputs.zip }}" --clobber --repo "${{ github.repository }}"
